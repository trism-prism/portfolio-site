name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check:quick
      - run: npm run build:e2e
      # Internal links and assets in the production build must resolve.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --root-dir "${{ github.workspace }}/out" './out/**/*.html'
          fail: true
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-traces, path: test-results, retention-days: 7 }
